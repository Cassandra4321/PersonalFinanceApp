services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: "Y"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -Q 'SELECT 1' -No",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  userservice:
    build:
      context: .
      dockerfile: UserService/UserService.API/Dockerfile
    container_name: userservice
    ports:
      - "5167:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__UserServiceDb: "Server=sqlserver;Database=UserServiceDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      RabbitMQ__Host: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy

  transactionservice:
    build:
      context: .
      dockerfile: TransactionService/TransactionService.API/Dockerfile
    container_name: transactionservice
    ports:
      - "5084:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TransactionServiceDb: "Server=sqlserver;Database=TransactionServiceDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      RabbitMQ__Host: rabbitmq
      Services__UserService: "http://userservice:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
      userservice:
        condition: service_started

  budgetservice:
    build:
      context: .
      dockerfile: BudgetService/BudgetService.API/Dockerfile
    container_name: budgetservice
    ports:
      - "5031:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BudgetServiceDb: "Server=sqlserver;Database=BudgetServiceDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      RabbitMQ__Host: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
